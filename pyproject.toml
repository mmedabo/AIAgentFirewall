[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentbench"
version = "0.2.0"
description = "A cybersecurity benchmark for AI agents — do they stay within authorized bounds?"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["ai", "agents", "benchmark", "cybersecurity", "safety", "guardrails", "evaluation"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
agentbench = "agentbench.cli:main"

[tool.setuptools.packages.find]
include = ["agentbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
